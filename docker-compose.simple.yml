services:
  server:
    environment:
      WHISPER_URL: http://whisper:9000
      OCR_URL: http://tesseract:8884
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
    depends_on:
      whisper:
        condition: service_healthy
      tesseract:
        condition: service_started

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  tesseract:
    image: hertzg/tesseract-server:latest
    ports:
      - "127.0.0.1:8884:8884"
    restart: unless-stopped

volumes:
  whisper_cache:
