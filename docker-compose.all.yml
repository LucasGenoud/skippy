# Skippy with Whisper, Tesseract, and Garage for S3-compatible attachment
# storage. Runs on its own; needs the Garage secrets in .env:
# docker compose -f docker-compose.all.yml up -d
services:
  server:
    image: ghcr.io/lucasgenoud/skippy:latest
    ports:
      - "8787:8787"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      EMBED_URL: ${EMBED_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      WHISPER_URL: http://whisper:9000
      OCR_URL: http://tesseract:8884
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      STORAGE: s3
      S3_URL: http://garage:3900
      S3_REGION: garage
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      ALLOW_PRIVATE_USER_ENDPOINTS: ${ALLOW_PRIVATE_USER_ENDPOINTS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_LABELING: ${LLM_LABELING:-}
      LLM_CHAT: ${LLM_CHAT:-}
      LLM_WRITING: ${LLM_WRITING:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - app_data:/data
    depends_on:
      whisper:
        condition: service_healthy
      tesseract:
        condition: service_started
      garage:
        condition: service_healthy
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  tesseract:
    image: hertzg/tesseract-server:latest
    ports:
      - "127.0.0.1:8884:8884"
    restart: unless-stopped

  # Single node; creates its default bucket and imports the S3 key from the
  # GARAGE_DEFAULT_* values on first start. No manual garage CLI steps.
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Set GARAGE_DEFAULT_ACCESS_KEY in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Set GARAGE_DEFAULT_SECRET_KEY in .env}
      GARAGE_DEFAULT_BUCKET: sticky-notes-default
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  docs:
    image: ghcr.io/lucasgenoud/skippy-docs:latest
    ports:
      - "${DOCS_PORT:-8123}:8123"
    restart: unless-stopped

volumes:
  app_data:
  whisper_cache:
  garage_meta:
  garage_data:

configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      # Single-node cluster: the node only ever talks RPC to itself.
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage"

      [admin]
      # Serves GET /health; with no token the admin endpoints stay disabled.
      api_bind_addr = "[::]:3903"
