# One command for the whole backend stack (API + web app + Whisper):
#   docker compose up -d          -> app at http://localhost:8787
#
# For local development you can run just the supporting services and keep
# `cargo run` on the host:
#   docker compose up -d whisper
#   STICKY_NOTES_WHISPER_URL=http://localhost:9000 cargo run
services:
  server:
    build: .
    ports:
      - "8787:8787"
    environment:
      STICKY_NOTES_WHISPER_URL: http://whisper:9000
    volumes:
      - app_data:/data # SQLite DB + uploaded files
      - model_cache:/models # embedding model (downloaded on first start)
    depends_on:
      # Wait until Whisper's HTTP server actually answers, not just until its
      # container starts — otherwise the server probes a not-yet-ready Whisper
      # and disables transcription for the whole life of the process.
      whisper:
        condition: service_healthy
    restart: unless-stopped

  # Local speech-to-text for audio notes. ffmpeg-based, so it accepts the
  # browser's webm/opus clips directly. First start downloads the model.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000" # exposed so a host `cargo run` can reach it in dev
    environment:
      ASR_MODEL: base # tiny | base | small | medium | large-v3
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper_cache:/root/.cache
    # The image loads its ASR model on boot (tens of seconds), during which the
    # HTTP server isn't answering yet. This gate lets `server` wait for a real
    # response before it runs its one-shot reachability probe.
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9000/docs" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  app_data:
  model_cache:
  whisper_cache:
