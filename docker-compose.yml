# Full stack: web app/API, Whisper transcription, and optional Garage S3.
# Start with: docker compose up -d
# Use STICKY_NOTES_STORAGE=s3 to store attachments in Garage.
services:
  server:
    build: .
    image: forgejo.genoud.dev/lucasgenoud/skippy:latest
    ports:
      - "8787:8787"
    environment:
      STICKY_NOTES_PUBLIC_URL: ${STICKY_NOTES_PUBLIC_URL:-}
      STICKY_NOTES_EMBED_URL: ${STICKY_NOTES_EMBED_URL:-}
      STICKY_NOTES_EMBED_MODEL: ${STICKY_NOTES_EMBED_MODEL:-bge-m3}
      STICKY_NOTES_EMBED_API_KEY: ${STICKY_NOTES_EMBED_API_KEY:-}
      STICKY_NOTES_WHISPER_URL: http://whisper:9000
      STICKY_NOTES_STORAGE: ${STICKY_NOTES_STORAGE:-disk}
      STICKY_NOTES_S3_URL: http://garage:3900
      STICKY_NOTES_S3_REGION: garage
      STICKY_NOTES_S3_ACCESS_KEY: ${STICKY_NOTES_S3_ACCESS_KEY:?Set STICKY_NOTES_S3_ACCESS_KEY in .env}
      STICKY_NOTES_S3_SECRET_KEY: ${STICKY_NOTES_S3_SECRET_KEY:?Set STICKY_NOTES_S3_SECRET_KEY in .env}
      STICKY_NOTES_ALLOW_PRIVATE_USER_ENDPOINTS: ${STICKY_NOTES_ALLOW_PRIVATE_USER_ENDPOINTS:-}
      # Optional server-managed LLM settings:
      # STICKY_NOTES_LLM_BASE_URL: http://ollama:11434/v1
      # STICKY_NOTES_LLM_API_KEY: ${STICKY_NOTES_LLM_API_KEY:-}
      # STICKY_NOTES_LLM_MODEL: llama3.1
      # STICKY_NOTES_LLM_LABELING: "true"
      # STICKY_NOTES_LLM_CHAT: "true"
      # STICKY_NOTES_LLM_WRITING: "true"
      # Optional link-preview/Telegram settings:
      # STICKY_NOTES_UNFURL_ALLOW_PRIVATE: "1"
      # STICKY_NOTES_TELEGRAM_API: https://api.telegram.org
    volumes:
      - app_data:/data
      - ${STICKY_NOTES_BACKUPS_DIR:-./backups}:/backups
    depends_on:
      whisper:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${STICKY_NOTES_S3_ACCESS_KEY:?Set STICKY_NOTES_S3_ACCESS_KEY in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${STICKY_NOTES_S3_SECRET_KEY:?Set STICKY_NOTES_S3_SECRET_KEY in .env}
      GARAGE_DEFAULT_BUCKET: sticky-notes-default
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  app_data:
  whisper_cache:
  garage_meta:
  garage_data:
