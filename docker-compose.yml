# One command for the whole backend stack (API + web app + vector DB):
#   docker compose up -d          -> app at http://localhost:8787
#
# For local development you can run just the vector database and keep
# `cargo run` on the host:
#   docker compose up -d qdrant
#   STICKY_NOTES_QDRANT_URL=http://localhost:6334 cargo run
services:
  server:
    build: .
    ports:
      - "8787:8787"
    environment:
      STICKY_NOTES_QDRANT_URL: http://qdrant:6334
    volumes:
      - app_data:/data       # SQLite DB + uploaded files
      - model_cache:/models  # embedding model (downloaded on first start)
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST / dashboard
      - "6334:6334" # gRPC (used by the backend)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  app_data:
  model_cache:
  qdrant_storage:
