name: build-image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked runtime databases
        run: |
          TRACKED=$(git ls-files -- ':(glob)backend/sticky_notes.db*')
          if [ -n "$TRACKED" ]; then
            echo "Runtime SQLite files must not be tracked:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Reject tracked secrets
        run: sh scripts/check-secrets.sh

      - name: Log in to the GitHub Container Registry
        env:
          REGISTRY: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build and push images
        run: |
          IMAGE=ghcr.io/lucasgenoud/skippy
          DOCS_IMAGE=ghcr.io/lucasgenoud/skippy-docs
          CLIENT_VERSION=$(awk '$1 == "version:" { split($2, parts, "+"); print parts[1]; exit }' app/pubspec.yaml)
          SERVER_VERSION=$(awk '$1 == "version" { gsub(/"/, "", $3); print $3; exit }' backend/Cargo.toml)
          case "$GITHUB_REF_NAME" in
            main)
              TAG=latest
              VERSION_SUFFIX="+$(git rev-list --count HEAD).$(git rev-parse --short=12 HEAD)"
              ;;
            dev)
              TAG=dev
              VERSION_SUFFIX="-dev+$(git rev-list --count HEAD).$(git rev-parse --short=12 HEAD)"
              ;;
            *)
              echo "Unsupported release branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          docker build --no-cache --pull \
            --build-arg CLIENT_VERSION="$CLIENT_VERSION" \
            --build-arg SERVER_VERSION="$SERVER_VERSION" \
            --build-arg VERSION_SUFFIX="$VERSION_SUFFIX" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          docker build --no-cache --pull -t "$DOCS_IMAGE:$TAG" ./mkdocs-material
          docker push "$DOCS_IMAGE:$TAG"

      - name: Drop dangling layers left by this build
        run: docker image prune -f
