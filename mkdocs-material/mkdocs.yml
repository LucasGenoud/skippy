site_name: Skippy
site_description: Documentation for the self-hosted Skippy notes app
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: amber
      accent: amber
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Set up Skippy: setup.md
  - Open Skippy: https://skippy-notes.com
  - GitHub: https://github.com/LucasGenoud/skippy
