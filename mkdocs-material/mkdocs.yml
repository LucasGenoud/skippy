site_name: Skippy
site_description: Documentation for the self-hosted Skippy notes app
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/skippy-logo.svg
  favicon: assets/skippy-logo.svg
  palette:
    - scheme: default
      primary: amber
      accent: amber
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Set up Skippy: setup.md
extra:
  app_url: https://skippy-notes.com
  github_url: https://github.com/LucasGenoud/skippy
