name: skippy
description: "A cross-platform notes app with a Rust backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0
  http_parser: ^4.0.0
  animations: ^2.0.11
  uuid: ^4.6.0
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.0
  image_picker: ^1.1.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.0
  web: ^1.1.0
  flutter_markdown_plus: ^1.0.12
  record: ^7.1.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  flutter_svg: ^2.3.0
  # file_picker 11 still depends on win32 5, which conflicts with share_plus
  # 13's win32 6 requirement. Keep the compatible stable release until
  # file_picker 12 leaves beta.
  share_plus: ^12.0.2
  receive_sharing_intent: ^1.8.1
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg

flutter_launcher_icons:
  image_path: "launcher_assets/icon.png"
  android: true
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "launcher_assets/foreground.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
