name: skippy
description: "A cross-platform notes app with a Rust backend."
publish_to: 'none'
version: 1.5.1+14

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0
  http_parser: ^4.0.0
  # animations 3 rebuilt OpenContainer on package:material_ui, whose Material
  # is a different class from package:flutter/material.dart's. Every InkWell we
  # hand to closedBuilder/openBuilder then fails its Material ancestor lookup.
  # Stay on 2.x until the framework's own material library is that package.
  animations: ^2.2.0
  uuid: ^4.6.0
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.0
  image_picker: ^1.1.0
  file_picker: ^12.1.1
  url_launcher: ^6.3.0
  web: ^1.1.0
  flutter_markdown_plus: ^1.0.12
  record: ^7.1.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  flutter_svg: ^2.3.0
  share_plus: ^13.3.0
  receive_sharing_intent: ^1.8.1
  archive: ^4.0.9
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.9.3
  native_geofence: ^1.3.1
  geolocator: ^14.0.3
  permission_handler: ^13.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the reconnect backoff without waiting out real seconds.
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg

flutter_launcher_icons:
  image_path: "launcher_assets/icon.png"
  android: true
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "launcher_assets/foreground.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  macos:
    generate: true
    image_path: "launcher_assets/icon.png"
  windows:
    generate: true
    image_path: "launcher_assets/icon.png"
    icon_size: 256
