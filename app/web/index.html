<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A cross-platform notes app.">
  <!-- Without this, mobile browsers lay the page out at 980px and scale it
       down, so the app's width-based mobile layouts never kick in on a phone.
       viewport-fit=cover goes with the translucent status bar below. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Translucent = edge-to-edge under the notch; the app compensates via
       SafeArea using the safe-area insets Flutter reads from the browser. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skippy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Skippy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter paints its own selection above an invisible DOM editing element.
       Hiding only that element's highlight is not enough in Firefox: selected
       text with no colour of its own is given a contrasting one, so the hidden
       element's text turns opaque and shows through as a second, offset
       selection. Pinning the colour transparent too leaves nothing to
       contrast with. Firefox's prefixed pseudo-element stays in its own rule:
       a selector list is dropped whole by a browser that does not know one of
       its parts. */
    .flt-text-editing::selection {
      background-color: transparent;
      color: transparent;
    }

    .flt-text-editing::-moz-selection {
      background-color: transparent;
      color: transparent;
    }

    /* Flutter mirrors a login form into the DOM so browsers can autofill it,
       but sizes every field except the focused one to 0x0, and a password
       manager skips fields it cannot see. Give them a size back, which is
       exactly what Flutter itself already does on Safari and for the same
       reason, and keep them from taking pointer events. They stay invisible:
       Flutter paints them with no colour, background or border.

       Size alone is not always enough. Some engine versions position the
       unfocused fields absolutely and park them at -9999px, which fails the
       same viewability check a second way. Pinning them back to the origin
       hands the placement to the transform Flutter already computes for each
       one, so the hidden input lands over the field it mirrors; where the
       fields are laid out statically instead, these two lines do nothing. */
    flutter-view form input:not(:focus):not(.submitBtn) {
      top: 0 !important;
      left: 0 !important;
      width: auto !important;
      height: auto !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
