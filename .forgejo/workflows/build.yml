name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: homeserver-runner
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked runtime databases
        run: |
          TRACKED=$(git ls-files -- ':(glob)backend/sticky_notes.db*')
          if [ -n "$TRACKED" ]; then
            echo "Runtime SQLite files must not be tracked:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Log in to the Forgejo registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login forgejo.genoud.dev --username "$REGISTRY_USER" --password-stdin

      - name: Build and push
        run: |
          IMAGE=forgejo.genoud.dev/lucasgenoud/skippy
          # --no-cache: never reuse layers from a previous run.
          # --pull: re-resolve the base images instead of trusting the local copy.
          docker build --no-cache --pull -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Drop older builds of this image
        run: |
          IMAGE=forgejo.genoud.dev/lucasgenoud/skippy
          # Scoped to this repository only: `reference` limits it to skippy tags,
          # `before` limits it to builds older than the one we just pushed. Images
          # a container is still running are refused by docker, hence `|| true`.
          OLD=$(docker image ls -q \
            --filter "reference=$IMAGE" \
            --filter "before=$IMAGE:${{ github.sha }}" | sort -u)
          [ -n "$OLD" ] && docker rmi $OLD || true
          exit 0
