name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: homeserver-runner
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Forgejo registry
        run: docker login forgejo.genoud.dev -u "${{ secrets.REGISTRY_USER }}" -p "${{ secrets.REGISTRY_TOKEN }}"

      - name: Build and push
        run: |
          IMAGE=forgejo.genoud.dev/lucasgenoud/skippy
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
