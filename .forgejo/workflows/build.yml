# Builds the full-stack image and pushes it to the Forgejo container registry.
# The homeserver deploys itself: a Watchtower container there polls the registry
# and restarts `server` whenever a new :latest appears. See docs/DEPLOY.md.
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a rebuild by hand from the Forgejo UI

jobs:
  build:
    runs-on: homeserver-runner 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.genoud.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            forgejo.genoud.dev/lucasgenoud/skippy:latest
            forgejo.genoud.dev/lucasgenoud/skippy:${{ github.sha }}