name: build-image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: homeserver-runner
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so it must see the complete
          # history rather than a shallow checkout.
          fetch-depth: 0

      - name: Reject tracked runtime databases
        run: |
          TRACKED=$(git ls-files -- ':(glob)backend/sticky_notes.db*')
          if [ -n "$TRACKED" ]; then
            echo "Runtime SQLite files must not be tracked:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Reject tracked secrets
        run: sh scripts/check-secrets.sh

      - name: Log in to the Forgejo registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login forgejo.genoud.dev --username "$REGISTRY_USER" --password-stdin

      - name: Build and push images
        run: |
          IMAGE=forgejo.genoud.dev/lucasgenoud/skippy
          DOCS_IMAGE=forgejo.genoud.dev/lucasgenoud/skippy-docs
          CLIENT_VERSION=$(awk '$1 == "version:" { split($2, parts, "+"); print parts[1]; exit }' app/pubspec.yaml)
          SERVER_VERSION=$(awk '$1 == "version" { gsub(/"/, "", $3); print $3; exit }' backend/Cargo.toml)
          case "$GITHUB_REF_NAME" in
            main)
              TAG=latest
              VERSION_SUFFIX="+$(git rev-list --count HEAD).$(git rev-parse --short=12 HEAD)"
              ;;
            dev)
              TAG=dev
              VERSION_SUFFIX="-dev+$(git rev-list --count HEAD).$(git rev-parse --short=12 HEAD)"
              ;;
            *)
              echo "Unsupported release branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          # --no-cache: never reuse layers from a previous run.
          # --pull: re-resolve the base images instead of trusting the local copy.
          docker build --no-cache --pull \
            --build-arg CLIENT_VERSION="$CLIENT_VERSION" \
            --build-arg SERVER_VERSION="$SERVER_VERSION" \
            --build-arg VERSION_SUFFIX="$VERSION_SUFFIX" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          docker build --no-cache --pull -t "$DOCS_IMAGE:$TAG" ./mkdocs-material
          docker push "$DOCS_IMAGE:$TAG"

      - name: Drop dangling layers left by this build
        run: |
          # Each branch has one rolling tag. Previous builds are left dangling
          # (untagged, <none>:<none>); images a container is still running are
          # refused by docker, hence `|| true`.
          docker image prune -f
          exit 0
