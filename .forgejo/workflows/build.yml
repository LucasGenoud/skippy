name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: homeserver-runner
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so it must see the complete
          # history rather than a shallow checkout.
          fetch-depth: 0

      - name: Reject tracked runtime databases
        run: |
          TRACKED=$(git ls-files -- ':(glob)backend/sticky_notes.db*')
          if [ -n "$TRACKED" ]; then
            echo "Runtime SQLite files must not be tracked:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Reject tracked secrets
        run: sh scripts/check-secrets.sh

      - name: Log in to the Forgejo registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login forgejo.genoud.dev --username "$REGISTRY_USER" --password-stdin

      - name: Build and push
        run: |
          IMAGE=forgejo.genoud.dev/lucasgenoud/skippy
          # SemVer build metadata: the release number is intentional, while
          # the commit count and hash identify the exact deployed build.
          VERSION_SUFFIX="+$(git rev-list --count HEAD).$(git rev-parse --short=12 HEAD)"
          # --no-cache: never reuse layers from a previous run.
          # --pull: re-resolve the base images instead of trusting the local copy.
          docker build --no-cache --pull --build-arg VERSION_SUFFIX="$VERSION_SUFFIX" -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

      - name: Drop dangling layers left by this build
        run: |
          # Only the "latest" tag is ever pushed now, so the previous build's
          # image is left dangling (untagged, <none>:<none>) rather than under
          # another tag. Images a container is still running are refused by
          # docker, hence `|| true`.
          docker image prune -f
          exit 0
