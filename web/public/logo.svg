<svg viewBox="190 72 300 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Skippy logo</title>
  <desc>Two overlapping sticky-note squares in yellow and brown, each with horizontal lines representing text.</desc>
  <!-- back note (brown) -->
  <rect x="230" y="130" width="200" height="200" rx="14" fill="#8a5a2b" transform="rotate(-6 330 230)"/>
  <g stroke="#c99a63" stroke-width="8" stroke-linecap="round" transform="rotate(-6 330 230)">
    <line x1="255" y1="185" x2="405" y2="185"/>
    <line x1="255" y1="215" x2="405" y2="215"/>
    <line x1="255" y1="245" x2="360" y2="245"/>
  </g>
  <!-- front note (yellow) -->
  <rect x="260" y="110" width="200" height="200" rx="14" fill="#f6c344" transform="rotate(5 360 210)"/>
  <g stroke="#a05a1e" stroke-width="8" stroke-linecap="round" transform="rotate(5 360 210)">
    <line x1="285" y1="165" x2="435" y2="165"/>
    <line x1="285" y1="195" x2="435" y2="195"/>
    <line x1="285" y1="225" x2="390" y2="225"/>
  </g>
</svg>
